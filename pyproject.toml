[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-power-forecast-optimization"
version = "0.1.0"
description = "Training-only gas power forecasting and constrained dispatch optimization"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "codefiles/src"}

[tool.setuptools.packages.find]
where = ["codefiles/src"]

[tool.pytest.ini_options]
testpaths = ["codefiles/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["codefiles/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"codefiles/tools/*.py" = ["E402", "E501", "B007"]  # Allow imports not at top, long lines, and unused loop vars in tools scripts

