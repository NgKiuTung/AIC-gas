name: repository-smoke-test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/base.txt -r requirements/dev.txt
      - run: pip install -e .
      - run: pytest codefiles/tests/smoke

